<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecPort Browser Client</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #121212; color: #f7f7f7; }
    #app { display: flex; flex-direction: column; align-items: center; padding: 24px; }
    #viewport { width: 640px; height: 360px; border: 2px solid #333; background: #000; position: relative; overflow: hidden; }
    .object { position: absolute; border-radius: 8px; background: rgba(100, 180, 255, 0.9); color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    #console { width: 640px; margin-top: 16px; padding: 12px; border: 1px solid #333; background: #101010; min-height: 120px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    button { margin-right: 8px; padding: 8px 14px; border: none; border-radius: 6px; background: #1f6feb; color: white; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .controls { margin-top: 12px; }
    .vr-card { margin-top: 18px; padding: 14px; border: 1px solid #2f3a4a; background: #151d29; border-radius: 10px; width: 640px; }
    .vr-card a { color: #7ed6ff; }
  </style>
</head>
<body>
  <div id="app">
    <h1>RecPort Browser Client</h1>
    <div id="viewport"></div>
    <div class="controls">
      <button id="connectBtn">Connect</button>
      <button id="refreshBtn" disabled>Refresh Scene</button>
      <button id="moveBtn" disabled>Move Marker</button>
      <a class="button-link" href="./real.html">Open Real Rec Room Build</a>
    </div>
    <div class="vr-card">
      <h3>VR / Meta Quest entry</h3>
      <p>Use this mode to open a headset-friendly view of the backend and launch the build from a compatible device.</p>
      <p><a href="./real.html">Enter VR / build launcher</a></p>
    </div>
    <div id="console"></div>
  </div>
  <script type="module" src="./client.js"></script>
</body>
</html>
